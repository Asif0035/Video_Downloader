name: Hourly API Health Check

on:
  schedule:
    # Runs every hour at minute 0
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Synthetic Health Checks
        env:
          TARGET_HOST: ${{ secrets.PRODUCTION_API_URL }}
        run: |
          python - << 'EOF'
          import os
          import sys
          import requests

          # Default test target - replace or pass secret in GitHub Settings
          base_url = os.environ.get('TARGET_HOST', 'http://localhost:5000').rstrip('/')
          test_url = 'https://www.youtube.com/watch?v=dQw4w9WgXcQ'

          print(f"Testing extraction on target: {base_url}")
          
          try:
              res = requests.post(
                  f"{base_url}/api/extract", 
                  json={"url": test_url}, 
                  timeout=15
              )
              
              if res.status_code != 200:
                  print(f"FAILED: /api/extract returned status {res.status_code}")
                  print(f"Response: {res.text}")
                  sys.exit(1)
                  
              data = res.json()
              if not data.get('qualities'):
                  print("FAILED: Extraction payload contains no video qualities")
                  sys.exit(1)
                  
              print("SUCCESS: Health check passed successfully!")
              
          except Exception as e:
              print(f"CRITICAL: Health check request failed with error: {e}")
              sys.exit(1)
          EOF